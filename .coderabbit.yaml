language: "ja-JP"

reviews:
  profile: "assertive"
  high_level_summary: true
  poem: false
  review_status: true
  auto_review:
    enabled: true
    drafts: false

  path_filters:
    - "!**/node_modules/**"
    - "!**/dist/**"
    - "!**/build/**"
    - "!**/*.lock.hcl"
    - "!package-lock.json"

  path_instructions:
    - path: "backend/src/**/*.ts"
      instructions: |
        このプロジェクトの規約に沿っているか確認してください。
        - `any` を使っていないか（型不明なら `unknown` + 型ガード）
        - 必須の値を `optional（?）` にしていないか
        - オブジェクトの型をインラインの `{}` で済ませず `type`/`interface` で明示しているか
        - ユーザー起因のエラー（入力ミス・ビジネスルール違反）は `AppError`（400/409等）、
          システムエラー（DB接続失敗・環境変数未設定等）は通常の `Error` を使っているか
        - ユーザーに返すエラーメッセージは日本語、サーバー内部のログ・システムエラーは英語になっているか

    - path: "backend/src/domain/**/*.ts"
      instructions: |
        - 値オブジェクトは `private constructor` + `static create()` でバリデーションを強制しているか
        - エンティティは `public constructor`（リポジトリからの復元用）になっているか
        - 「誰が操作できるか」の判断をApplication層で `entity.userId !== userId` のように直接比較せず、
          エンティティ自身にメソッド（例: `canBeDeletedBy(userId)`）を生やして委譲しているか

    - path: "backend/src/infrastructure/**/*.ts"
      instructions: |
        - DBの生データをリポジトリ内で必ずDomainクラスに変換して返しているか（生データを外に漏らしていないか）
        - 外部API連携でAPIキー・トークンをURLのクエリパラメータに埋め込んでいないか
          （ヘッダー経由にすべき。過去にTMDB APIキーがspan属性経由で漏洩した事故があるための重点確認項目）

    - path: "backend/src/**/telemetry*.ts"
      instructions: |
        - ベンダー固有API（New Relic固有等）ではなく素のOpenTelemetry API
          （`trace.getActiveSpan()?.setAttribute()`等）を使っているか
        - span属性に1KB超の文字列・1000要素超の配列・PII・秘密情報・自由文を入れていないか

    - path: ".github/workflows/**/*.yml"
      instructions: |
        - サードパーティaction・Dockerイメージの参照がタグではなくコミットSHA/digest固定になっているか
        - シークレットをログに出力する可能性のある記述（`echo`でのシークレット展開等）がないか

chat:
  auto_reply: true
