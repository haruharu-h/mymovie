name: Deploy

# mainブランチへのマージ後（信頼できるコードのみ）に限定する。
# Workload Identity連携で得られる一時アクセストークンは、同じジョブ内で動く
# コードなら誰でも読めてしまうため、外部PRの中身を特権つきで実行するトリガー
# （pull_request_target等）は使わない。詳細: docs/decisions.md「フェーズ7-4」
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/deploy.yml'

env:
  # GCP_PROJECT_ID/WORKLOAD_IDENTITY_PROVIDER/DEPLOYER_SERVICE_ACCOUNT/ARTIFACT_REGISTRY_REPO/
  # BACKEND_URL/FRONTEND_URLは、実際のインフラを特定できる値のためリポジトリシークレット
  # （Settings > Secrets and variables > Actions > Secrets）経由で渡す。
  # リポジトリ変数(vars)はジョブログを自動マスクしないため、値がgcloud/firebaseコマンドの
  # 実行結果としてログに出力されても平文で残ってしまう。シークレットとして登録した値は
  # ログに出現すると自動的に***へマスクされるため、こちらを使う。
  # インフラのTerraform構成自体は本リポジトリに含めていない
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: us-central1
  WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
  DEPLOYER_SERVICE_ACCOUNT: ${{ secrets.DEPLOYER_SERVICE_ACCOUNT }}
  ARTIFACT_REGISTRY_REPO: ${{ secrets.ARTIFACT_REGISTRY_REPO }}
  BACKEND_URL: ${{ secrets.BACKEND_URL }}
  FRONTEND_URL: ${{ secrets.FRONTEND_URL }}

permissions:
  contents: read

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: backend/.nvmrc
      - run: npm ci
      - run: npm test
      # Testcontainersが実DB(PostgreSQL)コンテナを起動する。GitHub Actionsのubuntu-latest
      # ランナーはDockerが標準で使えるため、ローカルと同じコマンドがそのまま動く
      - run: npm run test:integration

  build-and-push:
    needs: test-backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDCトークンを要求するために必須
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1
      - run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet
      # buildxのデフォルト("docker")ドライバはレジストリへのキャッシュ書き出し
      # (--cache-to type=registry)を扱えないため、それをサポートする"docker-container"
      # ドライバのbuilderを明示的に作成して使う（追加のactionは使わず、docker CLI標準の
      # サブコマンドのみで行う）。名前を明示し、以降のステップでも--builderで名指しすることで
      # 「現在のbuilder」という暗黙の状態に依存しない
      - run: docker buildx create --name ci-builder --driver docker-container --bootstrap
      # GitHub Actionsはジョブごとにまっさらな使い捨てVMのため、Dockerのレイヤーキャッシュは
      # 実行のたびに失われる。Artifact Registry自体をキャッシュの置き場所にして、次回以降の
      # 実行が前回のレイヤーを再利用できるようにする。docker-containerドライバはビルド結果を
      # ローカルのDocker daemonに自動ロードしないため、`docker build`+`docker push`を分けず
      # `docker buildx build --push`で直接レジストリに送る
      # イメージ参照(ARTIFACT_REGISTRY_REPO+github.sha)はGITHUB_OUTPUT/outputs経由で
      # 次のジョブに渡さない。ARTIFACT_REGISTRY_REPOがシークレットのため、それを含む値を
      # ジョブの出力(steps.*.outputs/jobs.*.outputs)に書くと、GitHub Actionsのシークレット
      # マスキングが出力の値自体を壊してしまう(ログ上の***表示だけでなく、
      # needs.<job>.outputs側で読んだ値が空になる)。deploy-backend側でも同じ
      # env.ARTIFACT_REGISTRY_REPO + github.shaから同じイメージ参照を組み立てることで、
      # 出力を経由させずに済ませている
      - id: build
        run: |
          IMAGE="${{ env.ARTIFACT_REGISTRY_REPO }}/backend:${{ github.sha }}"
          CACHE_IMAGE="${{ env.ARTIFACT_REGISTRY_REPO }}/backend:buildcache"
          docker buildx build --builder ci-builder --target production \
            --cache-from "type=registry,ref=$CACHE_IMAGE" \
            --cache-to "type=registry,ref=$CACHE_IMAGE,mode=max" \
            -t "$IMAGE" --push backend

  migrate:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: backend/.nvmrc
      - run: npm ci
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1
      # DATABASE_URLをGitHub Secretsに複製せず、Secret Manager(SSOT)からその場で取得する
      - name: Fetch DATABASE_URL from Secret Manager
        run: |
          echo "::add-mask::$(gcloud secrets versions access latest --secret=database_url --project=${{ env.GCP_PROJECT_ID }})"
          echo "DATABASE_URL=$(gcloud secrets versions access latest --secret=database_url --project=${{ env.GCP_PROJECT_ID }})" >> "$GITHUB_ENV"
      # DBが先行(旧コード+新DB)、アプリのデプロイはこの後。理由: notes/learning/2026-07-16-db-migration-deploy-order.md
      - run: npm run db:migrate

  deploy-backend:
    # needs.<job>は「直接needsに書いたジョブ」の出力しか参照できない
    # (migrate経由でbuild-and-pushの出力に間接的にはたどり着けない)ため両方書く
    needs: [build-and-push, migrate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1
      # --tag（リビジョンタグ）は使わない。使うとTerraformが継続的に差分を検出する既知の問題がある
      # (hashicorp/terraform-provider-google#17218)。docs/roadmap.md フェーズ7-4参照
      - run: |
          gcloud run deploy mymovie-backend \
            --image="${{ env.ARTIFACT_REGISTRY_REPO }}/backend:${{ github.sha }}" \
            --region="${{ env.GCP_REGION }}" \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --quiet

  deploy-frontend:
    needs: deploy-backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: frontend/.nvmrc
      - run: npm ci
      - run: npm run build
        env:
          VITE_BACKEND_URL: ${{ env.BACKEND_URL }}
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SERVICE_ACCOUNT }}
      - run: npx firebase-tools deploy --only hosting --project "${{ env.GCP_PROJECT_ID }}" --non-interactive
