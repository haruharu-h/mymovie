name: Secret Scan

# 実際のGCPアカウント識別子・個人情報がPRを通じて混入するのを、ローカルのpre-commit
# フック（.githooks/pre-commit）をすり抜けても最終的にブロックするための保険。
# ルールの正本は .gitleaks.toml（実ファイルはgitignore対象。検知ルール自体に実際の値が
# 含まれるため、リポジトリには.gitleaks.toml.example（プレースホルダー版）のみを置き、
# 本物の内容はGitHub Actionsシークレット GITLEAKS_CONFIG_TOML から読み込む）。
# ブランチ保護ルールで必須チェックに指定することで
# 「--no-verifyでローカルフックを回避されてもマージはできない」を担保する。
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # 全履歴を対象にする（過去のコミットへの混入も検知するため）

      # gitleaks公式のGitHub Actionは使わず、リリースバイナリを直接ダウンロードして
      # チェックサムを検証する。サードパーティActionの信頼範囲を増やさないため
      # （このリポジトリの既存方針、docs/decisions.md「フェーズ7-4」参照）
      - name: Install gitleaks
        run: |
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks

      # .gitleaks.tomlの実ファイルはリポジトリに含まれない（実際の値を含むためgitignore対象）。
      # 内容はシークレットとしてGitHub Actions側に登録し、環境変数経由でgitleaksに渡す
      # （gitleaksはGITLEAKS_CONFIG_TOML環境変数でinlineの設定内容を直接受け付ける）
      - name: Run gitleaks
        env:
          GITLEAKS_CONFIG_TOML: ${{ secrets.GITLEAKS_CONFIG_TOML }}
        run: ./gitleaks detect --source . --log-opts="--all" --no-banner -v
