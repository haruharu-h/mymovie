services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mymovie
      POSTGRES_USER: mymovie
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mymovie"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      DATABASE_URL: postgres://mymovie:${DB_PASSWORD}@db:5432/mymovie
      NODE_ENV: development
      ENABLE_API_DOCS: "true"
      BACKEND_URL: http://localhost:3000
      FRONTEND_URL: http://localhost:5173
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      TMDB_READ_ACCESS_TOKEN: ${TMDB_READ_ACCESS_TOKEN}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    depends_on:
      db:
        condition: service_healthy
      otel-collector:
        condition: service_started

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    volumes:
      - ./otel/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "8889:8889" # Prometheusスクレイプ用（ホストからも直接確認できるように公開）
    depends_on:
      jaeger:
        condition: service_started
      elasticsearch:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./otel/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus # 時系列データの永続化（無いとコンテナを消すと消える）
    ports:
      - "9090:9090" # Prometheus UI
    depends_on:
      - otel-collector

  grafana:
    image: grafana/grafana:latest
    volumes:
      - ./otel/grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3001:3000" # Grafana UI（backendの3000と被るためホスト側は3001）
    depends_on:
      - prometheus

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      discovery.type: single-node # 学習用の1台構成。クラスタを組まない
      xpack.security.enabled: "false" # ローカル学習用に認証を無効化（本番では有効にする）
      ES_JAVA_OPTS: "-Xms512m -Xmx512m" # メモリ使用量を抑える
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\"'"]
      interval: 5s
      timeout: 5s
      retries: 20 # 初回起動は時間がかかるため多めに待つ

  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: elasticsearch
      ES_SERVER_URLS: http://elasticsearch:9200
    ports:
      - "16686:16686" # Jaeger UI（OTLPポートはCollectorからのみ内部ネットワークで使うためホスト公開不要）
    depends_on:
      elasticsearch:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_BACKEND_URL: http://localhost:3000
    depends_on:
      - backend

volumes:
  db_data:
  prometheus_data:
  elasticsearch_data:
